name: Publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64 (deb)
            platform: ubuntu-22.04
            toolchain: stable-x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
          - name: Windows amd64 (NSIS)
            platform: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
            target: x86_64-pc-windows-gnu
            args: --target x86_64-pc-windows-gnu --bundles nsis

    runs-on: ${{ matrix.platform }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}

      - name: Install Windows GNU build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW-w64 to the Windows build PATH
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cygpath -m /mingw64/bin >> "$GITHUB_PATH"
          gcc --version

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: wmcssh v__VERSION__
          releaseBody: |
            wmcssh desktop installers.

            - Linux amd64: Debian package
            - Windows amd64: NSIS setup executable
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
